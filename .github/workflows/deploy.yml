name: Test and deploy Lambda

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: listening-lambda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest -v
      - name: Build Lambda package
        run: |
          mkdir -p /tmp/listening-package
          python -m pip install -r requirements.txt --target /tmp/listening-package
          cp lambda_function.py /tmp/listening-package/
          cd /tmp/listening-package
          zip -qr /tmp/listening-lambda.zip .
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::375398450526:role/listening-widget-github-deploy
          aws-region: us-west-2
      - name: Deploy Lambda
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws lambda update-function-code --function-name what-is-ryan-listening-to --zip-file fileb:///tmp/listening-lambda.zip
          aws lambda wait function-updated --function-name what-is-ryan-listening-to
